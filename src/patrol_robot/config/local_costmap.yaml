local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  
  # Timing optimized for Wi-Fi latency
  update_frequency: 3.0
  publish_frequency: 2.0
  transform_tolerance: 1.0   # Solves "extrapolation into the future" errors

  static_map: false
  rolling_window: true
  width: 2.0
  height: 2.0
  resolution: 0.05

  plugins:
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
